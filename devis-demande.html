<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Demande de devis — Diagnostic immobilier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F4F0;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ─── Header ─── */
    .header {
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 60%, #40916C 100%);
      padding: 30px 24px 26px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -50px; left: -30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
      pointer-events: none;
    }
    .header-title {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }
    .header-sub { color: #A7F3D0; font-size: 13px; margin: 0 0 10px; }
    .header-diag {
      display: inline-block;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px;
      padding: 5px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    /* ─── Container ─── */
    .container { max-width: 520px; margin: 0 auto; padding: 20px 16px 0; }

    /* ─── Section card ─── */
    .section {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
      border: 1.5px solid #E8F5F0;
      transition: border-color .2s;
    }
    .section.filled { border-color: #6EE7B7; }
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #1B4332;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: #F0FDF4;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }

    /* ─── Inputs texte ─── */
    .field-row { display: grid; gap: 10px; margin-bottom: 10px; }
    .field-row.two { grid-template-columns: 1fr 1fr; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 5px;
    }
    .field-label .req { color: #EF4444; }
    input[type="text"], input[type="tel"], input[type="email"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #E2E5F0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #FAFBFC;
      transition: border-color .2s, box-shadow .2s;
      color: #1A1D2E;
    }
    input:focus, textarea:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5,150,105,.1);
      background: #fff;
    }

    /* ─── Autocomplete adresse ─── */
    .ac-wrap { position: relative; }
    .ac-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1.5px solid #E2E5F0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      z-index: 100;
      overflow: hidden;
      display: none;
    }
    .ac-list.open { display: block; }
    .ac-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #F3F4F6;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: #F0FDF4; color: #065F46; }

    /* ─── Boutons sélection ─── */
    .btn-grid { display: grid; gap: 8px; }
    .btn-grid.col2 { grid-template-columns: 1fr 1fr; }
    .btn-grid.col3 { grid-template-columns: 1fr 1fr 1fr; }
    .btn-grid.col4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .sel-btn {
      padding: 12px 8px;
      border-radius: 12px;
      border: 2px solid #E2E5F0;
      background: #FAFBFC;
      font-size: 13px;
      font-weight: 700;
      color: #6B7280;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: all .18s;
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .sel-btn .bi { font-size: 22px; }
    .sel-btn:hover {
      border-color: #6EE7B7;
      background: #F0FDF4;
      color: #065F46;
      transform: translateY(-1px);
    }
    .sel-btn.selected {
      border-color: #059669;
      background: linear-gradient(135deg, #F0FDF4, #DCFCE7);
      color: #065F46;
      box-shadow: 0 2px 8px rgba(5,150,105,.2);
      transform: none;
    }
    .sel-btn.big {
      padding: 18px 12px;
      border-radius: 14px;
      border-width: 2.5px;
    }
    .sel-btn.big .bi { font-size: 30px; }
    .sel-btn.big .bl { font-size: 15px; }

    /* ─── Chips (surface) ─── */
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 9px 16px;
      border-radius: 20px;
      border: 2px solid #E2E5F0;
      background: #FAFBFC;
      font-size: 13px;
      font-weight: 700;
      color: #6B7280;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .chip:hover { border-color: #6EE7B7; color: #065F46; background: #F0FDF4; }
    .chip.selected { border-color: #059669; background: #059669; color: #fff; box-shadow: 0 2px 8px rgba(5,150,105,.3); }

    /* ─── Récap diagnostics ─── */
    .recap-box {
      background: linear-gradient(135deg, #F0FDF4, #ECFDF5);
      border: 2px solid #6EE7B7;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      display: none;
    }
    .recap-box.visible { display: block; }
    .recap-title { font-size: 13px; font-weight: 800; color: #065F46; margin-bottom: 12px; }
    .diag-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: #fff;
      border: 1.5px solid #A7F3D0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #065F46;
      margin: 3px;
    }

    /* ─── Bouton envoi ─── */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #1B4332, #2D6A4F, #40916C);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(27,67,50,.3);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,67,50,.4); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .5; cursor: default; transform: none; }

    .note-bas { text-align: center; font-size: 11px; color: #9CA3AF; margin-top: 12px; line-height: 1.5; }

    /* ─── Succès ─── */
    .success-screen { display: none; }
    .success-screen.visible { display: block; }

    /* ─── Erreur/Chargement ─── */
    .status-box { text-align: center; padding: 60px 24px; }
    .status-box h2 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .status-box p { font-size: 14px; color: #6B7280; }

    @media (max-width: 360px) {
      .btn-grid.col4 { grid-template-columns: 1fr 1fr; }
      .btn-grid.col3 { grid-template-columns: 1fr 1fr; }
      .field-row.two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1 class="header-title">Demande de devis</h1>
  <p class="header-sub">Diagnostic immobilier — réponse sous 24h</p>
  <span class="header-diag" id="header-diag"></span>
</div>

<div class="container" id="main-wrap">
  <div class="status-box">
    <p style="font-size:24px;margin-bottom:12px">⏳</p>
    <p>Chargement...</p>
  </div>
</div>

<script>
// ─── Init ───
var _code = '';
var _state = { transaction: null, bien: null, periode: null, elec: null, gaz: null, surface: null, dep: [] };
var _acTimer = null;

(function() {
  var params = new URLSearchParams(window.location.search);
  _code = params.get('code') || '';
  if (!_code) { showError('Lien invalide', 'Ce lien ne contient pas de code valide.'); return; }
  fetch('/.netlify/functions/send-devis-request?code=' + _code)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.valid) { showError('Lien invalide', data.error || 'Ce lien ne fonctionne plus.'); return; }
      document.getElementById('header-diag').textContent = '👷 ' + data.nom_diag;
      renderForm();
    })
    .catch(function() { showError('Erreur réseau', 'Impossible de charger la page. Réessaie dans quelques instants.'); });
})();

// ─── Rendu du formulaire ───
function renderForm() {
  document.getElementById('main-wrap').innerHTML =

    // 1. Contact
    '<div class="section" id="sec-contact">'
    + '<div class="section-title"><div class="sec-icon">👤</div>Vos coordonnées</div>'
    + '<div class="field-row two">'
    + '<div><label class="field-label">Prénom <span class="req">*</span></label><input type="text" id="f-prenom" placeholder="Marie" oninput="checkFilled()"/></div>'
    + '<div><label class="field-label">Nom <span class="req">*</span></label><input type="text" id="f-nom" placeholder="Dupont" oninput="checkFilled()"/></div>'
    + '</div>'
    + '<div class="field-row two">'
    + '<div><label class="field-label">Téléphone <span class="req">*</span></label><input type="tel" id="f-tel" placeholder="06 00 00 00 00" oninput="checkFilled()"/></div>'
    + '<div><label class="field-label">Email <span class="req">*</span></label><input type="email" id="f-email" placeholder="marie@exemple.fr" oninput="checkFilled()"/></div>'
    + '</div>'
    + '</div>'

    // 2. Adresse
    + '<div class="section" id="sec-adr">'
    + '<div class="section-title"><div class="sec-icon">📍</div>Adresse du bien <span style="color:#EF4444">*</span></div>'
    + '<div class="ac-wrap"><input type="text" id="f-adresse" placeholder="Commencez à taper l\'adresse..." autocomplete="off" oninput="onAdrInput(this.value)"/><div class="ac-list" id="ac-list"></div></div>'
    + '</div>'

    // 3. Transaction
    + '<div class="section" id="sec-tr">'
    + '<div class="section-title"><div class="sec-icon">🔑</div>Type de transaction <span style="color:#EF4444">*</span></div>'
    + '<div class="btn-grid col2">'
    + '<button class="sel-btn big" onclick="sel1(\'transaction\',\'vente\',this)"><span class="bi">🏷️</span><span class="bl">Vente</span></button>'
    + '<button class="sel-btn big" onclick="sel1(\'transaction\',\'location\',this)"><span class="bi">🔑</span><span class="bl">Location</span></button>'
    + '</div></div>'

    // 4. Type de bien
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">🏘️</div>Type de bien</div>'
    + '<div class="btn-grid col4">'
    + '<button class="sel-btn" onclick="sel1(\'bien\',\'appartement\',this)"><span class="bi">🏢</span>Appartement</button>'
    + '<button class="sel-btn" onclick="sel1(\'bien\',\'maison\',this)"><span class="bi">🏠</span>Maison</button>'
    + '<button class="sel-btn" onclick="sel1(\'bien\',\'local\',this)"><span class="bi">🏪</span>Local comm.</button>'
    + '<button class="sel-btn" onclick="sel1(\'bien\',\'autre\',this)"><span class="bi">🏗️</span>Autre</button>'
    + '</div></div>'

    // 5. Période
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">📅</div>Année de construction</div>'
    + '<div class="btn-grid col3">'
    + '<button class="sel-btn" onclick="sel1(\'periode\',\'avant1949\',this)"><span class="bi">🏚️</span>Avant 1949</button>'
    + '<button class="sel-btn" onclick="sel1(\'periode\',\'1949-1997\',this)"><span class="bi">🏛️</span>1949 – 1997</button>'
    + '<button class="sel-btn" onclick="sel1(\'periode\',\'apres1997\',this)"><span class="bi">🏙️</span>Après 1997</button>'
    + '</div></div>'

    // 6. Électricité
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">⚡</div>Installation électrique</div>'
    + '<div class="btn-grid col2">'
    + '<button class="sel-btn" onclick="sel1(\'elec\',\'plus15\',this)"><span class="bi">🔌</span>Plus de 15 ans</button>'
    + '<button class="sel-btn" onclick="sel1(\'elec\',\'moins15\',this)"><span class="bi">✅</span>Moins de 15 ans</button>'
    + '</div></div>'

    // 7. Gaz
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">🔥</div>Installation gaz</div>'
    + '<div class="btn-grid col3">'
    + '<button class="sel-btn" onclick="sel1(\'gaz\',\'oui-plus15\',this)"><span class="bi">🔥</span>Oui, +15 ans</button>'
    + '<button class="sel-btn" onclick="sel1(\'gaz\',\'oui-moins15\',this)"><span class="bi">🔥</span>Oui, -15 ans</button>'
    + '<button class="sel-btn" onclick="sel1(\'gaz\',\'non\',this)"><span class="bi">❌</span>Pas de gaz</button>'
    + '</div></div>'

    // 8. Surface
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">📐</div>Surface du bien</div>'
    + '<div class="chip-grid">'
    + '<button class="chip" onclick="selChip(\'surface\',\'moins50\',this)">Moins de 50 m²</button>'
    + '<button class="chip" onclick="selChip(\'surface\',\'50-100\',this)">50 à 100 m²</button>'
    + '<button class="chip" onclick="selChip(\'surface\',\'100-150\',this)">100 à 150 m²</button>'
    + '<button class="chip" onclick="selChip(\'surface\',\'150-200\',this)">150 à 200 m²</button>'
    + '<button class="chip" onclick="selChip(\'surface\',\'plus200\',this)">Plus de 200 m²</button>'
    + '</div></div>'

    // 9. Dépendances
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">🏗️</div>Dépendances <small style="font-weight:400;color:#9CA3AF;font-size:11px;margin-left:4px">(plusieurs choix possibles)</small></div>'
    + '<div class="btn-grid col4">'
    + '<button class="sel-btn multi" onclick="togMulti(\'dep\',\'cave\',this)"><span class="bi">🪨</span>Cave</button>'
    + '<button class="sel-btn multi" onclick="togMulti(\'dep\',\'garage\',this)"><span class="bi">🚗</span>Garage</button>'
    + '<button class="sel-btn multi" onclick="togMulti(\'dep\',\'grenier\',this)"><span class="bi">🏠</span>Grenier</button>'
    + '<button class="sel-btn multi" onclick="togMulti(\'dep\',\'piscine\',this)"><span class="bi">🏊</span>Piscine</button>'
    + '</div>'
    + '<div style="margin-top:8px"><button class="chip" id="btn-aucune" onclick="selAucune()">Aucune dépendance</button></div>'
    + '</div>'

    // Récap diagnostics
    + '<div class="recap-box" id="recap-diags">'
    + '<div class="recap-title">⚡ Diagnostics estimés pour votre bien</div>'
    + '<div id="recap-tags"></div>'
    + '<p style="font-size:11px;color:#6B7280;margin:10px 0 0;line-height:1.5">Liste indicative — votre diagnostiqueur vous confirmera les diagnostics exacts.</p>'
    + '</div>'

    // Notes
    + '<div class="section">'
    + '<div class="section-title"><div class="sec-icon">💬</div>Informations complémentaires <small style="font-weight:400;color:#9CA3AF;font-size:11px">(optionnel)</small></div>'
    + '<textarea id="f-notes" placeholder="Code d\'accès, questions, informations utiles..." style="min-height:80px;resize:vertical"></textarea>'
    + '</div>'

    // Envoi
    + '<div style="margin-bottom:20px">'
    + '<button class="btn-submit" id="btn-submit" onclick="soumettre()" disabled>📩 Envoyer ma demande de devis</button>'
    + '<p class="note-bas">🔒 Vos données sont transmises uniquement à votre diagnostiqueur<br>Réponse garantie sous 24h ouvrées</p>'
    + '</div>'

    // Succès
    + '<div class="success-screen" id="success-screen">'
    + '<div class="section" style="text-align:center;padding:36px 24px">'
    + '<div style="font-size:64px;margin-bottom:16px">✅</div>'
    + '<h2 style="font-size:20px;font-weight:800;color:#065F46;margin:0 0 8px">Demande envoyée !</h2>'
    + '<p style="font-size:14px;color:#6B7280;line-height:1.6">Votre demande a bien été transmise.<br>Votre diagnostiqueur vous contactera sous <strong>24h</strong> pour vous confirmer le devis.</p>'
    + '</div></div>';

  checkFilled();
}

// ─── Sélection unique ───
function sel1(group, value, btn) {
  _state[group] = value;
  var grid = btn.closest('.btn-grid');
  grid.querySelectorAll('.sel-btn').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  updateDiags();
  checkFilled();
}

// ─── Chip unique ───
function selChip(group, value, chip) {
  _state[group] = value;
  chip.closest('.chip-grid').querySelectorAll('.chip').forEach(function(c) { c.classList.remove('selected'); });
  chip.classList.add('selected');
}

// ─── Multi-select ───
function togMulti(group, value, btn) {
  var idx = _state[group].indexOf(value);
  if (idx === -1) { _state[group].push(value); btn.classList.add('selected'); }
  else { _state[group].splice(idx, 1); btn.classList.remove('selected'); }
  var aucune = document.getElementById('btn-aucune');
  if (aucune) aucune.classList.remove('selected');
}
function selAucune() {
  _state.dep = [];
  document.querySelectorAll('.sel-btn.multi').forEach(function(b) { b.classList.remove('selected'); });
  var aucune = document.getElementById('btn-aucune');
  if (aucune) aucune.classList.toggle('selected');
}

// ─── Calcul diagnostics ───
var DIAGS = {
  'DPE': '🌡️ DPE',
  'Électricité': '⚡ Électricité',
  'Gaz': '🔥 Gaz',
  'Plomb': '🔩 Plomb (CREP)',
  'Amiante': '⚠️ Amiante',
  'ERP': '🗺️ ERP',
  'Carrez': '📐 Loi Carrez',
  'Boutin': '📋 Loi Boutin'
};
function calcDiagsLocal() {
  var p = _state.periode; var t = _state.transaction; var b = _state.bien;
  if (!t || !p) return [];
  var avant1949 = (p === 'avant1949');
  var avant1997 = (avant1949 || p === '1949-1997');
  var vente = (t === 'vente'); var location = (t === 'location');
  var appart = (b === 'appartement'); var maison = (b === 'maison');
  var res = ['DPE'];
  if (_state.elec === 'plus15') res.push('Électricité');
  if (_state.gaz === 'oui-plus15') res.push('Gaz');
  if (avant1949) res.push('Plomb');
  if (avant1997 && !(location && maison)) res.push('Amiante');
  res.push('ERP');
  if (vente && appart) res.push('Carrez');
  if (location) res.push('Boutin');
  return res;
}
function updateDiags() {
  var box = document.getElementById('recap-diags');
  var tags = document.getElementById('recap-tags');
  if (!box || !tags) return;
  var diags = calcDiagsLocal();
  if (!diags.length) { box.classList.remove('visible'); return; }
  tags.innerHTML = diags.map(function(d) { return '<span class="diag-tag">' + (DIAGS[d] || d) + '</span>'; }).join('');
  box.classList.add('visible');
}

// ─── Vérification formulaire ───
function checkFilled() {
  var btn = document.getElementById('btn-submit');
  if (!btn) return;
  var prenom = (document.getElementById('f-prenom') || {}).value || '';
  var nom    = (document.getElementById('f-nom')    || {}).value || '';
  var tel    = (document.getElementById('f-tel')    || {}).value || '';
  var email  = (document.getElementById('f-email')  || {}).value || '';
  var adr    = (document.getElementById('f-adresse')|| {}).value || '';
  btn.disabled = !(prenom.trim() && nom.trim() && tel.trim() && email.trim() && adr.trim() && _state.transaction);
  var secC = document.getElementById('sec-contact');
  if (secC) secC.classList.toggle('filled', !!(prenom.trim() && nom.trim() && tel.trim() && email.trim()));
  var secA = document.getElementById('sec-adr');
  if (secA) secA.classList.toggle('filled', !!adr.trim());
  var secT = document.getElementById('sec-tr');
  if (secT) secT.classList.toggle('filled', !!_state.transaction);
}

// ─── Autocomplete adresse ───
function onAdrInput(val) {
  clearTimeout(_acTimer);
  checkFilled();
  if (val.length < 3) { closeAc(); return; }
  _acTimer = setTimeout(function() {
    fetch('https://api-adresse.data.gouv.fr/search/?q=' + encodeURIComponent(val) + '&limit=5')
      .then(function(r) { return r.json(); })
      .then(function(data) { showAc(data.features || []); })
      .catch(function() { closeAc(); });
  }, 280);
}
function showAc(features) {
  var list = document.getElementById('ac-list');
  if (!list || !features.length) { closeAc(); return; }
  list.innerHTML = features.map(function(f) {
    var label = f.properties.label || '';
    return '<div class="ac-item" onclick="selAc(\'' + label.replace(/'/g, "\\'") + '\')">'
      + '<span>📍</span><span>' + label + '</span></div>';
  }).join('');
  list.classList.add('open');
}
function selAc(label) {
  var inp = document.getElementById('f-adresse');
  if (inp) inp.value = label;
  closeAc();
  checkFilled();
}
function closeAc() {
  var list = document.getElementById('ac-list');
  if (list) list.classList.remove('open');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.ac-wrap')) closeAc();
});

// ─── Soumission ───
function soumettre() {
  var prenom = (document.getElementById('f-prenom') || {}).value || '';
  var nom    = (document.getElementById('f-nom')    || {}).value || '';
  var tel    = (document.getElementById('f-tel')    || {}).value || '';
  var email  = (document.getElementById('f-email')  || {}).value || '';
  var adr    = (document.getElementById('f-adresse')|| {}).value || '';
  var notes  = (document.getElementById('f-notes')  || {}).value || '';

  if (!prenom.trim() || !nom.trim() || !tel.trim() || !email.trim() || !adr.trim() || !_state.transaction) {
    alert('Merci de remplir les champs obligatoires (coordonnées, adresse et type de transaction).');
    return;
  }

  var btn = document.getElementById('btn-submit');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Envoi en cours...'; }

  fetch('/.netlify/functions/send-devis-request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code:        _code,
      prenom:      prenom.trim(),
      nom:         nom.trim(),
      tel:         tel.trim(),
      email:       email.trim(),
      adresse:     adr.trim(),
      transaction: _state.transaction,
      bien:        _state.bien,
      periode:     _state.periode,
      elec:        _state.elec,
      gaz:         _state.gaz,
      surface:     _state.surface,
      dependances: _state.dep,
      notes:       notes.trim()
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      // Masquer le formulaire, afficher le succès
      var wrap = document.getElementById('main-wrap');
      if (!wrap) return;
      var sections = wrap.querySelectorAll('.section, .recap-box, [style*="margin-bottom:20px"]');
      sections.forEach(function(s) { s.style.display = 'none'; });
      var succ = document.getElementById('success-screen');
      if (succ) succ.classList.add('visible');
    } else {
      alert('Erreur : ' + (data.error || 'Impossible d\'envoyer la demande. Réessaie.'));
      if (btn) { btn.disabled = false; btn.textContent = '📩 Envoyer ma demande de devis'; }
    }
  })
  .catch(function() {
    alert('Erreur réseau. Vérifie ta connexion et réessaie.');
    if (btn) { btn.disabled = false; btn.textContent = '📩 Envoyer ma demande de devis'; }
  });
}

// ─── États ───
function showError(titre, msg) {
  document.getElementById('main-wrap').innerHTML =
    '<div class="status-box"><h2 style="color:#EF4444">⚠️ ' + titre + '</h2><p>' + msg + '</p></div>';
}
</script>
</body>
</html>
